<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Автоимперия</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#0b0b0f;
  color:white;
  min-height:100vh;
}

.app{
  max-width:500px;
  margin:auto;
  padding:18px 14px 90px;
}

h1{
  text-align:center;
  font-size:28px;
  margin-bottom:8px;
}

.balance{
  text-align:center;
  font-size:22px;
  font-weight:bold;
  color:#42ff8b;
  margin-bottom:20px;
}

.level{
  text-align:center;
  color:#aaa;
  margin-bottom:20px;
}

.case{
  background:linear-gradient(145deg,#171720,#101015);
  border:1px solid #292936;
  border-radius:20px;
  padding:22px;
  text-align:center;
  box-shadow:0 10px 35px rgba(0,0,0,.35);
}

.case-title{
  font-size:22px;
  font-weight:bold;
  margin-bottom:15px;
}

.case-icon{
  font-size:75px;
  margin:15px 0;
}

button{
  border:none;
  border-radius:13px;
  padding:13px 18px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.open-btn{
  width:100%;
  background:#42ff8b;
  color:#07140c;
  margin-top:10px;
}

.open-btn:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.section{
  display:none;
  margin-top:20px;
}

.section.active{
  display:block;
}

.card{
  background:#15151d;
  border:1px solid #292936;
  border-radius:16px;
  padding:16px;
  margin-bottom:12px;
}

.car{
  border:2px solid #333;
  border-radius:16px;
  padding:15px;
  margin-bottom:12px;
  background:#121219;
}

.car-name{
  font-size:19px;
  font-weight:bold;
}

.car-info{
  color:#aaa;
  margin-top:5px;
}

.sell-btn{
  margin-top:10px;
  background:#ff4545;
  color:white;
}

.market-item{
  background:#15151d;
  border-radius:16px;
  padding:16px;
  margin-bottom:12px;
  border:2px solid #292936;
}

.market-name{
  font-size:20px;
  font-weight:bold;
}

.market-price{
  color:#42ff8b;
  font-weight:bold;
  margin:7px 0;
}

.buy-btn{
  background:#42ff8b;
  color:#07140c;
}

.bottom{
  position:fixed;
  left:50%;
  transform:translateX(-50%);
  bottom:0;
  width:100%;
  max-width:500px;
  background:#111116;
  border-top:1px solid #292936;
  display:flex;
  justify-content:space-around;
  padding:10px 5px;
  z-index:20;
}

.nav-btn{
  background:transparent;
  color:#888;
  font-size:12px;
  padding:7px;
}

.nav-btn.active{
  color:#42ff8b;
}

/* РЕДКОСТИ */

.rarity-normal{
  color:#aaa;
}

.rarity-uncommon{
  color:#42ff8b;
}

.rarity-rare{
  color:#4da6ff;
}

.rarity-epic{
  color:#b85cff;
}

.rarity-legendary{
  color:#ffd84d;
}

.rarity-mythic{
  color:#ff4545;
}

/* РАМКИ */

.car.normal{
  border-color:#777;
}

.car.uncommon{
  border-color:#42ff8b;
}

.car.rare{
  border-color:#4da6ff;
}

.car.epic{
  border-color:#b85cff;
}

.car.legendary{
  border-color:#ffd84d;
}

.car.mythic{
  border-color:#ff4545;
}

/* РЕЗУЛЬТАТ */

.result{
  margin-top:20px;
  padding:20px;
  border-radius:18px;
  background:#101017;
  border:2px solid #333;
  text-align:center;
  display:none;
}

.result.show{
  display:block;
}

.result-icon{
  font-size:70px;
  margin:10px;
}

.result-name{
  font-size:24px;
  font-weight:bold;
}

.result-rarity{
  font-size:18px;
  margin-top:6px;
}

.result.normal{
  border-color:#777;
}

.result.uncommon{
  border-color:#42ff8b;
  box-shadow:0 0 20px rgba(66,255,139,.2);
}

.result.rare{
  border-color:#4da6ff;
  box-shadow:0 0 20px rgba(77,166,255,.25);
}

.result.epic{
  border-color:#b85cff;
  box-shadow:0 0 25px rgba(184,92,255,.3);
}

.result.legendary{
  border-color:#ffd84d;
  box-shadow:0 0 30px rgba(255,216,77,.3);
}

.result.mythic{
  border-color:#ff4545;
  box-shadow:0 0 35px rgba(255,69,69,.35);
}

/* АНИМАЦИЯ */

.roulette{
  display:none;
  margin-top:20px;
  background:#101017;
  border:2px solid #292936;
  border-radius:18px;
  padding:20px 10px;
  overflow:hidden;
  position:relative;
}

.roulette.show{
  display:block;
}

.roulette-title{
  text-align:center;
  color:#aaa;
  font-size:14px;
  margin-bottom:10px;
}

.roll-icon{
  text-align:center;
  font-size:72px;
  height:90px;
  line-height:90px;
}

.roll-name{
  text-align:center;
  font-size:22px;
  font-weight:bold;
  min-height:28px;
}

.roll-rarity{
  text-align:center;
  font-size:16px;
  margin-top:5px;
}

.pointer{
  position:absolute;
  top:8px;
  left:50%;
  transform:translateX(-50%);
  width:0;
  height:0;
  border-left:8px solid transparent;
  border-right:8px solid transparent;
  border-top:12px solid #42ff8b;
}

@keyframes pulse{
  0%{transform:scale(1)}
  50%{transform:scale(1.08)}
  100%{transform:scale(1)}
}

.winner-animation{
  animation:pulse .45s ease;
}

/* ПРОФИЛЬ */

.stat{
  display:flex;
  justify-content:space-between;
  padding:12px 0;
  border-bottom:1px solid #292936;
}

.stat:last-child{
  border-bottom:none;
}
</style>
</head>

<body>

<div class="app">

<h1>🚘 Автоимперия</h1>

<div class="level">
  Уровень <span id="level">1</span>
</div>

<div class="balance">
  <span id="balance">10 000</span> ₽
</div>

<!-- ГЛАВНАЯ -->

<div id="home" class="section active">

<div class="case">

<div class="case-title">
  🚘 Автомобильный кейс
</div>

<div class="case-icon">
  🎁
</div>

<div style="color:#aaa;margin-bottom:10px">
  Испытай удачу и получи автомобиль!
</div>

<button id="openButton" class="open-btn" onclick="openCase()">
  Открыть за 500 ₽
</button>

</div>

<div id="roulette" class="roulette">

<div class="pointer"></div>

<div class="roulette-title">
  Открытие кейса...
</div>

<div id="rollIcon" class="roll-icon">
  🚗
</div>

<div id="rollName" class="roll-name">
  LADA Vesta
</div>

<div id="rollRarity" class="roll-rarity">
  Обычная
</div>

</div>

<div id="result" class="result">

<div id="resultIcon" class="result-icon">
  🚗
</div>

<div id="resultName" class="result-name">
  LADA Vesta
</div>

<div id="resultRarity" class="result-rarity">
  Обычная
</div>

<div style="margin-top:8px;color:#42ff8b">
  Автомобиль добавлен в гараж!
</div>

</div>

</div>

<!-- ГАРАЖ -->

<div id="garage" class="section">

<h2 style="margin-bottom:15px">
  🚗 Гараж
</h2>

<div id="garageList"></div>

</div>

<!-- РЫНОК -->

<div id="market" class="section">

<h2 style="margin-bottom:15px">
  🏪 Рынок
</h2>

<div id="marketList"></div>

</div>

<!-- ПРОФИЛЬ -->

<div id="profile" class="section">

<h2 style="margin-bottom:15px">
  👤 Профиль
</h2>

<div class="card">

<div class="stat">
  <span>Уровень</span>
  <b id="profileLevel">1</b>
</div>

<div class="stat">
  <span>Потрачено</span>
  <b id="spent">0 ₽</b>
</div>

<div class="stat">
  <span>Продано машин</span>
  <b id="sold">0</b>
</div>

<div class="stat">
  <span>Машин в гараже</span>
  <b id="garageCount">0</b>
</div>

</div>

</div>

</div>

<!-- НИЖНЕЕ МЕНЮ -->

<div class="bottom">

<button class="nav-btn active" onclick="showSection('home',this)">
  🏠<br>Главная
</button>

<button class="nav-btn" onclick="showSection('garage',this)">
  🚗<br>Гараж
</button>

<button class="nav-btn" onclick="showSection('market',this)">
  🏪<br>Рынок
</button>

<button class="nav-btn" onclick="showSection('profile',this)">
  👤<br>Профиль
</button>

</div>

<script>

/* =========================
   МАШИНЫ ИЗ КЕЙСА
========================= */

const cars=[

{
name:"LADA Vesta",
icon:"🚗",
rarity:"Обычная",
rarityClass:"normal",
chance:55,
value:800
},

{
name:"Kia Rio",
icon:"🚙",
rarity:"Необычная",
rarityClass:"uncommon",
chance:25,
value:2500
},

{
name:"BMW E36",
icon:"🚘",
rarity:"Редкая",
rarityClass:"rare",
chance:13,
value:8000
},

{
name:"BMW M5 E60",
icon:"🏎️",
rarity:"Эпическая",
rarityClass:"epic",
chance:5,
value:25000
},

{
name:"Mercedes AMG",
icon:"🏎️",
rarity:"Легендарная",
rarityClass:"legendary",
chance:1.8,
value:80000
},

{
name:"Lamborghini",
icon:"🏎️",
rarity:"Мифическая",
rarityClass:"mythic",
chance:.2,
value:500000
}

];


/* =========================
   МАШИНЫ НА РЫНКЕ
========================= */

const marketCars=[

{
name:"BMW M6",
icon:"🚗",
rarity:"Редкая",
rarityClass:"rare",
value:15000
},

{
name:"BMW F10",
icon:"🚘",
rarity:"Необычная",
rarityClass:"uncommon",
value:25000
},

{
name:"BMW M5 F90",
icon:"🏎️",
rarity:"Эпическая",
rarityClass:"epic",
value:75000
},

{
name:"Lamborghini Urus",
icon:"🐂",
rarity:"Легендарная",
rarityClass:"legendary",
value:250000
},

{
name:"Haval",
icon:"🚙",
rarity:"Обычная",
rarityClass:"normal",
value:12000
},

{
name:"Mercedes GT",
icon:"🏁",
rarity:"Легендарная",
rarityClass:"legendary",
value:180000
}

];


/* =========================
   ДАННЫЕ ИГРЫ
========================= */

let data=JSON.parse(
  localStorage.getItem("autoEmpire")
)||{

balance:10000,
garage:[],
spent:0,
sold:0

};


/* =========================
   СОХРАНЕНИЕ
========================= */

function save(){

localStorage.setItem(
  "autoEmpire",
  JSON.stringify(data)
);

}


/* =========================
   ФОРМАТ ЧИСЕЛ
========================= */

function money(value){

return Math.floor(value)
.toLocaleString("ru-RU");

}


/* =========================
   УРОВЕНЬ
========================= */

function getLevel(){

return Math.max(
  1,
  Math.floor(data.spent/10000)+1
);

}


/* =========================
   ОБНОВЛЕНИЕ
========================= */

function update(){

document.getElementById("balance").textContent=
money(data.balance);

document.getElementById("level").textContent=
getLevel();

document.getElementById("profileLevel").textContent=
getLevel();

document.getElementById("spent").textContent=
money(data.spent)+" ₽";

document.getElementById("sold").textContent=
data.sold;

document.getElementById("garageCount").textContent=
data.garage.length;

renderGarage();
renderMarket();

save();

}


/* =========================
   ВЫБОР МАШИНЫ
========================= */

function randomCar(){

let random=Math.random()*100;
let current=0;

for(const car of cars){

current+=car.chance;

if(random<=current){

return car;

}

}

return cars[0];

}


/* =========================
   ЗВУКИ
========================= */

let audioContext=null;

function getAudio(){

if(!audioContext){

audioContext=
new (window.AudioContext||
window.webkitAudioContext)();

}

if(audioContext.state==="suspended"){

audioContext.resume();

}

return audioContext;

}


/* звук одного щелчка */

function tickSound(){

const ctx=getAudio();

const oscillator=
ctx.createOscillator();

const gain=
ctx.createGain();

oscillator.type="square";

oscillator.frequency.value=
420+Math.random()*160;

gain.gain.setValueAtTime(
0.035,
ctx.currentTime
);

gain.gain.exponentialRampToValueAtTime(
0.001,
ctx.currentTime+0.06
);

oscillator.connect(gain);
gain.connect(ctx.destination);

oscillator.start();

oscillator.stop(
ctx.currentTime+0.06
);

}


/* звук выигрыша */

function winSound(){

const ctx=getAudio();

const notes=[
523.25,
659.25,
783.99,
1046.5
];

notes.forEach((freq,i)=>{

const oscillator=
ctx.createOscillator();

const gain=
ctx.createGain();

oscillator.type="sine";

oscillator.frequency.value=freq;

const start=
ctx.currentTime+i*0.11;

gain.gain.setValueAtTime(
0.001,
start
);

gain.gain.exponentialRampToValueAtTime(
0.18,
start+0.025
);

gain.gain.exponentialRampToValueAtTime(
0.001,
start+0.28
);

oscillator.connect(gain);
gain.connect(ctx.destination);

oscillator.start(start);

oscillator.stop(start+0.3);

});

}


/* =========================
   ОТКРЫТИЕ КЕЙСА
========================= */

let opening=false;

function openCase(){

if(opening){
return;
}

if(data.balance<500){

alert("Недостаточно денег!");

return;

}

opening=true;

const button=
document.getElementById("openButton");

button.disabled=true;

const roulette=
document.getElementById("roulette");

const result=
document.getElementById("result");

result.classList.remove("show");

roulette.classList.add("show");


/* списываем 500 только один раз */

data.balance-=500;

data.spent+=500;

update();


/* заранее выбираем победителя */

const winner=randomCar();


/* элементы */

const icon=
document.getElementById("rollIcon");

const name=
document.getElementById("rollName");

const rarity=
document.getElementById("rollRarity");


/* запуск */

let delay=70;

let elapsed=0;

let cycles=0;

const totalTime=2600;

function roll(){

if(elapsed>=totalTime){

finishCase();

return;

}

const temp=
cars[Math.floor(
Math.random()*cars.length
)];

icon.textContent=temp.icon;

name.textContent=temp.name;

rarity.textContent=temp.rarity;

rarity.className=
"roll-rarity rarity-"+temp.rarityClass;

tickSound();

cycles++;

elapsed+=delay;


/* постепенно замедляемся */

if(elapsed<1200){

delay=70;

}else if(elapsed<1800){

delay=110;

}else if(elapsed<2200){

delay=170;

}else{

delay=240;

}

setTimeout(roll,delay);

}

roll();


/* =========================
   ФИНАЛ
========================= */

function finishCase(){

icon.textContent=
winner.icon;

name.textContent=
winner.name;

rarity.textContent=
winner.rarity;

rarity.className=
"roll-rarity rarity-"+winner.rarityClass;


/* победный звук */

winSound();


/* добавляем машину */

data.garage.push({

name:winner.name,

icon:winner.icon,

rarity:winner.rarity,

rarityClass:winner.rarityClass,

value:winner.value

});

update();


/* небольшая пауза перед показом результата */

setTimeout(()=>{

roulette.classList.remove("show");

const resultIcon=
document.getElementById("resultIcon");

const resultName=
document.getElementById("resultName");

const resultRarity=
document.getElementById("resultRarity");

result.className=
"result show "+winner.rarityClass;

resultIcon.textContent=
winner.icon;

resultName.textContent=
winner.name;

resultRarity.textContent=
winner.rarity;

resultRarity.className=
"result-rarity rarity-"+winner.rarityClass;

result.classList.add("winner-animation");

setTimeout(()=>{

result.classList.remove("winner-animation");

},500);

button.disabled=false;

opening=false;

},500);

}

}


/* =========================
   ГАРАЖ
========================= */

function renderGarage(){

const list=
document.getElementById("garageList");

if(data.garage.length===0){

list.innerHTML=`
<div class="card" style="text-align:center;color:#888">
  Гараж пуст
</div>
`;

return;

}

list.innerHTML="";

data.garage.forEach((car,index)=>{

const div=
document.createElement("div");

div.className=
"car "+(car.rarityClass||"normal");

div.innerHTML=`

<div style="font-size:50px">
  ${car.icon}
</div>

<div class="car-name">
  ${car.name}
</div>

<div class="car-info rarity-${car.rarityClass||"normal"}">
  ${car.rarity}
</div>

<div class="car-info">
  Стоимость: ${money(car.value)} ₽
</div>

<button
class="sell-btn"
onclick="sellCar(${index})">
  Продать за ${money(car.value)} ₽
</button>

`;

list.appendChild(div);

});

}


/* =========================
   ПРОДАЖА МАШИНЫ
========================= */

function sellCar(index){

const car=data.garage[index];

if(!car){
return;
}

data.balance+=car.value;

data.sold++;

data.garage.splice(index,1);

update();

}


/* =========================
   РЫНОК
========================= */

function renderMarket(){

const list=
document.getElementById("marketList");

list.innerHTML="";

marketCars.forEach((car,index)=>{

const div=
document.createElement("div");

div.className="market-item";

div.style.borderColor=
getRarityColor(car.rarityClass);

div.innerHTML=`

<div style="font-size:50px">
  ${car.icon}
</div>

<div class="market-name">
  ${car.name}
</div>

<div class="market-rarity rarity-${car.rarityClass}">
  ${car.rarity}
</div>

<div class="market-price">
  ${money(car.value)} ₽
</div>

<button
class="buy-btn"
onclick="buyMarketCar(${index})">

Купить

</button>

`;

list.appendChild(div);

});

}


/* =========================
   ЦВЕТ РЕДКОСТИ
========================= */

function getRarityColor(type){

if(type==="normal"){
return"#777";
}

if(type==="uncommon"){
return"#42ff8b";
}

if(type==="rare"){
return"#4da6ff";
}

if(type==="epic"){
return"#b85cff";
}

if(type==="legendary"){
return"#ffd84d";
}

if(type==="mythic"){
return"#ff4545";
}

return"#292936";

}


/* =========================
   ПОКУПКА НА РЫНКЕ
========================= */

function buyMarketCar(index){

const car=
marketCars[index];

if(!car){
return;
}

if(data.balance<car.value){

alert("Недостаточно денег!");

return;

}

data.balance-=car.value;

data.spent+=car.value;

data.garage.push({

name:car.name,

icon:car.icon,

rarity:car.rarity,

rarityClass:car.rarityClass,

value:car.value

});

update();

alert(
"🚗 "+car.name+
" куплен и добавлен в гараж!"
);

}


/* =========================
   ПЕРЕКЛЮЧЕНИЕ РАЗДЕЛОВ
========================= */

function showSection(section,button){

document.querySelectorAll(".section")
.forEach(el=>{
el.classList.remove("active");
});

document.getElementById(section)
.classList.add("active");

document.querySelectorAll(".nav-btn")
.forEach(el=>{
el.classList.remove("active");
});

button.classList.add("active");

}


/* =========================
   ЗАПУСК
========================= */

update();

</script>

</body>
</html>
