<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Автоимперия</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif
}

body{
background:#08090d;
color:#fff;
min-height:100vh
}

.app{
max-width:520px;
margin:auto;
padding:16px 14px 96px
}

h1{
text-align:center;
font-size:28px;
margin:2px 0 4px
}

.balance{
text-align:center;
color:#42ff8b;
font-size:23px;
font-weight:800;
margin:8px
}

.level{
text-align:center;
color:#858590;
margin-bottom:18px
}

.section{
display:none
}

.section.active{
display:block
}

.cases-title{
font-size:22px;
font-weight:800;
margin:8px 0 12px
}

/* КЕЙСЫ */

.case{
position:relative;
overflow:hidden;
background:linear-gradient(145deg,#171922,#0e1016);
border:1px solid #2b2e39;
border-radius:22px;
padding:15px;
margin-bottom:13px;
box-shadow:0 12px 30px #0008
}

.case.standard{
border-color:#555
}

.case.rare{
border-color:#3979bd
}

.case.legendary{
border-color:#a88522
}

.case.mythic{
border-color:#8c3fc1
}

.case-head{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px
}

.case-title{
font-size:20px;
font-weight:800
}

.case-price{
font-weight:800;
color:#42ff8b
}

.case-desc{
color:#888;
font-size:13px;
margin:5px 0 10px
}

.case-preview{
height:112px;
border-radius:16px;
background:
radial-gradient(circle at 50% 55%,#ffffff12,transparent 45%),
linear-gradient(#11131a,#08090d);
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
margin-bottom:10px
}

.case-preview svg{
width:88%;
height:100%
}

.open-btn{
width:100%;
border:0;
border-radius:13px;
padding:13px;
background:#42ff8b;
color:#06130b;
font-size:16px;
font-weight:800
}

.open-btn:disabled{
opacity:.4
}

/* РУЛЕТКА */

.roulette{
display:none;
margin:16px 0;
background:#0f1117;
border:2px solid #2a2d38;
border-radius:20px;
padding:16px;
position:relative;
text-align:center
}

.roulette.show{
display:block
}

.pointer{
position:absolute;
top:7px;
left:50%;
transform:translateX(-50%);
border-left:8px solid transparent;
border-right:8px solid transparent;
border-top:12px solid #42ff8b
}

.roll-car{
height:175px;
margin-top:8px
}

.roll-car svg{
width:100%;
height:100%
}

.roll-name{
font-size:22px;
font-weight:800
}

.roll-rarity{
margin-top:5px
}

/* РЕЗУЛЬТАТ */

.result{
display:none;
text-align:center;
padding:18px;
border-radius:20px;
background:#101218;
margin-bottom:16px
}

.result.show{
display:block
}

.result-car{
height:190px
}

.result-car svg{
width:100%;
height:100%
}

.result-name{
font-size:25px;
font-weight:800
}

.result-value{
color:#42ff8b;
margin-top:7px
}

/* РЕДКОСТИ */

.normal{
color:#aaa
}

.rare-t{
color:#55a8ff
}

.epic{
color:#c46bff
}

.legendary{
color:#ffd84d
}

.mythic{
color:#ff5570
}

/* ГАРАЖ */

.car-card{
background:#12141b;
border:2px solid #30333e;
border-radius:18px;
padding:13px;
margin-bottom:12px
}

.car-card.normal{
border-color:#666
}

.car-card.rare-t{
border-color:#3979bd
}

.car-card.epic{
border-color:#9d51c9
}

.car-card.legendary{
border-color:#9b7b20
}

.car-card.mythic{
border-color:#a43f56
}

.car-image{
height:155px;
border-radius:14px;
background:
radial-gradient(circle at 50% 55%,#ffffff10,transparent 48%),
linear-gradient(#151821,#090a0f);
overflow:hidden
}

.car-image svg{
width:100%;
height:100%
}

.car-name{
font-size:19px;
font-weight:800;
margin-top:8px
}

.muted{
color:#888;
margin-top:4px
}

.sell,
.buy{
width:100%;
border:0;
border-radius:12px;
padding:12px;
margin-top:10px;
font-weight:800
}

.sell{
background:#ff4545;
color:#fff
}

.buy{
background:#42ff8b;
color:#06130b
}

/* ПРОФИЛЬ */

.card{
background:#15171f;
border:1px solid #2a2d38;
border-radius:16px;
padding:16px
}

.stat{
display:flex;
justify-content:space-between;
padding:13px 0;
border-bottom:1px solid #292c36
}

.stat:last-child{
border:0
}

/* НИЖНЕЕ МЕНЮ */

.bottom{
position:fixed;
bottom:0;
left:50%;
transform:translateX(-50%);
width:100%;
max-width:520px;
background:#101116ee;
backdrop-filter:blur(12px);
border-top:1px solid #292c36;
display:flex;
justify-content:space-around;
padding:8px 4px calc(8px + env(safe-area-inset-bottom));
z-index:20
}

.nav-btn{
border:0;
background:transparent;
color:#777;
font-size:12px;
padding:5px
}

.nav-btn.active{
color:#42ff8b
}

/* УВЕДОМЛЕНИЕ */

.toast{
position:fixed;
left:50%;
bottom:80px;
transform:translate(-50%,20px);
background:#20232c;
border:1px solid #3a3e4a;
padding:11px 16px;
border-radius:12px;
opacity:0;
pointer-events:none;
transition:.25s;
z-index:50;
white-space:nowrap
}

.toast.show{
opacity:1;
transform:translate(-50%,0)
}
</style>
</head>

<body>

<div class="app">

<h1>🚘 Автоимперия</h1>

<div class="level">
Уровень <span id="level">1</span>
</div>

<div class="balance">
<span id="balance">10 000</span> ₽
</div>


<!-- ГЛАВНАЯ -->

<div id="home" class="section active">

<div class="cases-title">
🎁 Автомобильные кейсы
</div>

<div id="cases"></div>


<!-- РУЛЕТКА -->

<div id="roulette" class="roulette">

<div class="pointer"></div>

<div style="color:#888">
Открытие кейса...
</div>

<div id="rollCar" class="roll-car"></div>

<div id="rollName" class="roll-name">
...
</div>

<div id="rollRarity" class="roll-rarity">
...
</div>

</div>


<!-- РЕЗУЛЬТАТ -->

<div id="result" class="result">

<div id="resultCar" class="result-car"></div>

<div id="resultName" class="result-name"></div>

<div id="resultRarity"></div>

<div id="resultValue" class="result-value"></div>

<div style="color:#42ff8b;margin-top:8px">
🚗 Автомобиль добавлен в гараж!
</div>

</div>

</div>


<!-- ГАРАЖ -->

<div id="garage" class="section">

<h2 style="margin-bottom:14px">
🚗 Гараж
</h2>

<div id="garageList"></div>

</div>


<!-- РЫНОК -->

<div id="market" class="section">

<h2 style="margin-bottom:14px">
🏪 Рынок
</h2>

<div id="marketList"></div>

</div>


<!-- ПРОФИЛЬ -->

<div id="profile" class="section">

<h2 style="margin-bottom:14px">
👤 Профиль
</h2>

<div class="card">

<div class="stat">
<span>Уровень</span>
<b id="profileLevel">1</b>
</div>

<div class="stat">
<span>Потрачено</span>
<b id="spent">0 ₽</b>
</div>

<div class="stat">
<span>Продано машин</span>
<b id="sold">0</b>
</div>

<div class="stat">
<span>Машин в гараже</span>
<b id="garageCount">0</b>
</div>

</div>

</div>

</div>


<!-- НИЖНЕЕ МЕНЮ -->

<div class="bottom">

<button
class="nav-btn active"
onclick="showSection('home',this)">
🏠<br>
Главная
</button>

<button
class="nav-btn"
onclick="showSection('garage',this)">
🚗<br>
Гараж
</button>

<button
class="nav-btn"
onclick="showSection('market',this)">
🏪<br>
Рынок
</button>

<button
class="nav-btn"
onclick="showSection('profile',this)">
👤<br>
Профиль
</button>

</div>


<div id="toast" class="toast"></div>


<script>

/* =========================================
   ЦВЕТА АВТОМОБИЛЕЙ
========================================= */

const colors=[

{
name:"Чёрный",
c:"#111318",
h:"#383d47"
},

{
name:"Белый",
c:"#e9edf2",
h:"#ffffff"
},

{
name:"Красный",
c:"#b91f2d",
h:"#ff6570"
},

{
name:"Синий",
c:"#2458a6",
h:"#62a1ff"
},

{
name:"Зелёный",
c:"#246b51",
h:"#64d7aa"
}

];


/* =========================================
   ВСТРОЕННЫЕ 2D-МАШИНЫ
========================================= */

function carSVG(name,color="#cfd4dc",highlight="#fff"){

let type="sedan";

if(
/Urus|Haval|Range Rover|Land Cruiser|Matiz|УАЗ|Nexia/i
.test(name)
){
type="suv";
}

if(
/McLaren|Bugatti|Lamborghini|M5|M6|M3|M4|Mercedes GT|Sport|Chiron/i
.test(name)
){
type="sport";
}

const roof =
type==="suv"
?
"M90 103 L130 55 Q145 43 175 43 L235 43 Q263 45 286 103"
:
"M100 103 L138 58 Q151 45 178 43 L228 43 Q253 45 275 103";

const id =
btoa(
unescape(
encodeURIComponent(name)
)
).slice(0,5);

return `

<svg
viewBox="0 0 400 190"
xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient
id="g${id}"
x1="0"
x2="0"
y1="0"
y2="1">

<stop
stop-color="${highlight}"/>

<stop
offset=".28"
stop-color="${color}"/>

<stop
offset="1"
stop-color="${color}"/>

</linearGradient>

</defs>


<!-- ТЕНЬ -->

<ellipse
cx="200"
cy="151"
rx="150"
ry="16"
fill="#000"
opacity=".65"/>


<!-- КУЗОВ -->

<path
d="${roof} L305 105 Q325 110 340 125 L345 145 L55 145 Q60 117 78 108 Z"
fill="url(#g${id})"
stroke="#ffffff33"
stroke-width="2"/>


<!-- СТЁКЛА -->

<path
d="M143 58 L133 99 L263 99 L252 58 Z"
fill="#10151d"
stroke="#ffffff25"/>

<path
d="M151 60 L143 94 L194 94 L194 59Z"
fill="#263647"/>

<path
d="M200 59 L200 94 L254 94 L246 61Z"
fill="#263647"/>


<!-- ОТРАЖЕНИЕ -->

<path
d="M70 112 L115 103 L285 103 L329 114"
fill="none"
stroke="#fff"
opacity=".18"
stroke-width="3"/>


<!-- НИЗ -->

<path
d="M57 126 L342 126"
stroke="#000"
opacity=".35"
stroke-width="7"/>


<!-- КОЛЁСА -->

<circle
cx="105"
cy="143"
r="25"
fill="#08090c"/>

<circle
cx="105"
cy="143"
r="13"
fill="#69717d"/>

<circle
cx="295"
cy="143"
r="25"
fill="#08090c"/>

<circle
cx="295"
cy="143"
r="13"
fill="#69717d"/>


<!-- ФАРЫ -->

<rect
x="66"
y="116"
width="30"
height="10"
rx="5"
fill="#f7f0bd"/>

<rect
x="304"
y="116"
width="30"
height="10"
rx="5"
fill="#ff3445"/>


<!-- БЛИК -->

<path
d="M85 106 Q200 83 315 106"
fill="none"
stroke="#fff"
opacity=".28"
stroke-width="3"/>

</svg>

`;

}


/* =========================================
   КЕЙСЫ
========================================= */

const cases={

standard:{

name:"Стандартный кейс",

price:500,

cls:"standard",

desc:"Доступные автомобили для старта",

cars:[

["VAZ 2114",28,1800],

["VAZ 2109",22,1600],

["VAZ 2199",16,2200],

["PRIORA",12,3500],

["Deo Matiz",10,2800],

["Nexia",7,4200],

["УАЗ",3,5500],

["Haval",2,7500]

]

},


rare:{

name:"Редкий кейс",

price:5000,

cls:"rare",

desc:"Более быстрые и дорогие автомобили",

cars:[

["GRANTA SPORT",22,18000],

["VESTA SPORT",18,24000],

["Ford Focus",15,28000],

["Skoda",13,30000],

["Subaru",11,35000],

["Audi",9,42000],

["Toyota Camry XV70",7,65000],

["Toyota Land Cruiser 200",5,85000]

]

},


legendary:{

name:"Легендарный кейс",

price:50000,

cls:"legendary",

desc:"Премиальные BMW, Mercedes и супер-кары",

cars:[

["BMW M5 F10",19,120000],

["BMW M6",16,135000],

["BMW M5 F90",14,170000],

["BMW M3 Competition",12,190000],

["BMW M4 Competition",11,210000],

["BMW M5 CS",9,240000],

["Mercedes GT",8,280000],

["Range Rover",6,300000],

["Lamborghini Urus",5,380000]

]

},


mythic:{

name:"Мистический кейс",

price:250000,

cls:"mythic",

desc:"Коллекционные автомобили высшего уровня",

cars:[

["Toyota Camry XV70",24,650000],

["BMW M5 CS",20,900000],

["Mercedes GT",16,1100000],

["Lamborghini Urus",13,1350000],

["McLaren 700",10,1700000],

["Rolls Royce Phantom",6,2200000],

["Bugatti Chiron",3,4000000],

["Toyota Land Cruiser 200",8,800000]

]

}

};


/* =========================================
   РЫНОК
========================================= */

const market=[

["VAZ 2114","normal",2500],

["VESTA SPORT","rare-t",30000],

["Toyota Camry XV70","epic",80000],

["BMW M5 F10","legendary",145000],

["BMW M5 CS","legendary",270000],

["Lamborghini Urus","legendary",420000],

["Rolls Royce Phantom","mythic",1250000]

];


const rarityByCase={

standard:"normal",

rare:"rare-t",

legendary:"legendary",

mythic:"mythic"

};


const carDB={};


Object.entries(cases).forEach(

([type,cs])=>{

cs.cars.forEach(

([name,chance,value])=>{

if(!carDB[name]){

carDB[name]={

name:name,

value:value,

caseType:type,

rarityClass:
rarityByCase[type]

};

}

});

});


/* =========================================
   СОХРАНЕНИЕ
========================================= */

let data=
JSON.parse(
localStorage.getItem("autoEmpire")
)
||
{

balance:10000,

garage:[],

spent:0,

sold:0

};


let opening=false;

let audio=null;


/* =========================================
   ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
========================================= */

function money(value){

return Math.floor(value)
.toLocaleString("ru-RU");

}


function save(){

localStorage.setItem(
"autoEmpire",
JSON.stringify(data)
);

}


function level(){

return Math.max(
1,
Math.floor(data.spent/25000)+1
);

}


function esc(s){

return s
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;");

}


function colorFor(){

return colors[
Math.floor(
Math.random()*colors.length
)
];

}


/* =========================================
   ЗВУК
========================================= */

function audioCtx(){

if(!audio){

audio=
new(
window.AudioContext ||
window.webkitAudioContext
)();

}

if(
audio.state==="suspended"
){

audio.resume();

}

return audio;

}


function tick(){

let c=audioCtx();

let o=
c.createOscillator();

let g=
c.createGain();

o.frequency.value=
450+Math.random()*200;

g.gain.value=.025;

o.connect(g);

g.connect(c.destination);

o.start();

o.stop(
c.currentTime+.055
);

}


function win(){

let c=audioCtx();

[523,659,784,1047]
.forEach(

(f,i)=>{

let o=
c.createOscillator();

let g=
c.createGain();

o.frequency.value=f;

g.gain.value=.001;

o.connect(g);

g.connect(c.destination);

let t=
c.currentTime+i*.1;

g.gain
.exponentialRampToValueAtTime(
.15,
t+.02
);

g.gain
.exponentialRampToValueAtTime(
.001,
t+.25
);

o.start(t);

o.stop(t+.27);

});

}


/* =========================================
   УВЕДОМЛЕНИЕ
========================================= */

function toast(message){

let t=
document.getElementById(
"toast"
);

t.textContent=message;

t.classList.add("show");

setTimeout(

()=>{

t.classList.remove("show");

},

2200

);

}


/* =========================================
   ВЫБОР МАШИНЫ
========================================= */

function pick(type){

const arr=
cases[type].cars;

let total=
arr.reduce(
(a,x)=>a+x[1],
0
);

let r=
Math.random()*total;

for(
const x of arr
){

r-=x[1];

if(r<=0){

return{

name:x[0],

value:x[2],

type:type

};

}

}

return{

name:arr[0][0],

value:arr[0][2],

type:type

};

}


/* =========================================
   ПОКАЗ КЕЙСОВ
========================================= */

function renderCases(){

document.getElementById(
"cases"
).innerHTML=

Object.entries(cases)
.map(

([type,cs])=>{

const preview=
pick(type);

const c=
colorFor();

return`

<div class="case ${cs.cls}">

<div class="case-head">

<div class="case-title">
${cs.name}
</div>

<div class="case-price">
${money(cs.price)} ₽
</div>

</div>


<div class="case-desc">
${cs.desc}
</div>


<div class="case-preview">

${carSVG(
preview.name,
c.c,
c.h
)}

</div>


<button
class="open-btn"
id="${type}Btn"
onclick="openCase('${type}')">

Открыть за
${money(cs.price)} ₽

</button>

</div>

`;

}

).join("");

}


/* =========================================
   ОБНОВЛЕНИЕ
========================================= */

function update(){

document.getElementById(
"balance"
).textContent=
money(data.balance);


document.getElementById(
"level"
).textContent=
level();


document.getElementById(
"profileLevel"
).textContent=
level();


document.getElementById(
"spent"
).textContent=
money(data.spent)+" ₽";


document.getElementById(
"sold"
).textContent=
data.sold;


document.getElementById(
"garageCount"
).textContent=
data.garage.length;


renderGarage();

renderMarket();

save();

}


/* =========================================
   ОТКРЫТИЕ КЕЙСА
========================================= */

function openCase(type){

if(opening)
return;


const cs=
cases[type];


if(
data.balance<
cs.price
){

toast(
"❌ Недостаточно денег"
);

return;

}


opening=true;


document.getElementById(
type+"Btn"
).disabled=true;


data.balance-=
cs.price;

data.spent+=
cs.price;


update();


const winner=
pick(type);


const color=
colorFor();


const roulette=
document.getElementById(
"roulette"
);


const result=
document.getElementById(
"result"
);


roulette.classList.add(
"show"
);


result.classList.remove(
"show"
);


let elapsed=0;

let delay=65;


function roll(){

if(
elapsed>=2700
){

finish();

return;

}


const temp=
pick(type);


const cc=
colorFor();


document.getElementById(
"rollCar"
).innerHTML=
carSVG(
temp.name,
cc.c,
cc.h
);


document.getElementById(
"rollName"
).textContent=
temp.name;


document.getElementById(
"rollRarity"
).textContent=
cs.name;


document.getElementById(
"rollRarity"
).className=
"roll-rarity "+
rarityByCase[type];


tick();


elapsed+=delay;


if(
elapsed>1500
)
delay=105;


if(
elapsed>2100
)
delay=170;


if(
elapsed>2450
)
delay=240;


setTimeout(
roll,
delay
);

}


function finish(){

win();


const car={

name:winner.name,

value:winner.value,

type:type,

rarityClass:
rarityByCase[type],

color:color

};


data.garage.push(car);


update();


document.getElementById(
"rollCar"
).innerHTML=
carSVG(
winner.name,
color.c,
color.h
);


document.getElementById(
"rollName"
).textContent=
winner.name;


document.getElementById(
"rollRarity"
).textContent=
cs.name;


setTimeout(

()=>{

roulette.classList.remove(
"show"
);


result.className=
"result show";


result.style.border=
"2px solid "+
(
type==="mythic"
?"#ff5570":

type==="legendary"
?"#ffd84d":

type==="rare"
?"#55a8ff":

"#666"
);


document.getElementById(
"resultCar"
).innerHTML=
carSVG(
winner.name,
color.c,
color.h
);


document.getElementById(
"resultName"
).textContent=
winner.name;


document.getElementById(
"resultRarity"
).textContent=
cs.name;


document.getElementById(
"resultRarity"
).className=
rarityByCase[type];


document.getElementById(
"resultValue"
).textContent=
"Стоимость: "+
money(winner.value)+
" ₽";


document.getElementById(
type+"Btn"
).disabled=false;


opening=false;


toast(

type==="mythic"

?

"🔥 МИСТИЧЕСКОЕ ВЫПАДЕНИЕ! "+
winner.name

:

"🎉 Выпал "+
winner.name

);

},

550

);

}


roll();

}


/* =========================================
   ГАРАЖ
========================================= */

function renderGarage(){

const list=
document.getElementById(
"garageList"
);


if(
data.garage.length===0
){

list.innerHTML=

`

<div
class="card"
style="text-align:center;color:#888">

Гараж пуст

</div>

`;

return;

}


list.innerHTML=
data.garage
.map(

(c,i)=>`

<div
class="car-card ${c.rarityClass}">

<div class="car-image">

${carSVG(

c.name,

c.color?.c ||
"#cfd4dc",

c.color?.h ||
"#fff"

)}

</div>


<div class="car-name">

${esc(c.name)}

</div>


<div
class="muted ${c.rarityClass}">

${cases[c.type]?.name ||
"Автомобиль"}

</div>


<div class="muted">

${c.color?.name ||
"Цвет кузова"}

</div>


<div class="muted">

Стоимость:
${money(c.value)} ₽

</div>


<button
class="sell"
onclick="sellCar(${i})">

Продать за
${money(c.value)} ₽

</button>

</div>

`

).join("");

}


/* =========================================
   ПРОДАЖА
========================================= */

function sellCar(i){

let c=
data.garage[i];


if(!c)
return;


data.balance+=
c.value;


data.sold++;


data.garage.splice(
i,
1
);


update();


toast(
"💰 Машина продана"
);

}


/* =========================================
   РЫНОК
========================================= */

function renderMarket(){

document.getElementById(
"marketList"
).innerHTML=

market.map(

(m,i)=>{

const col=
colorFor();

return`

<div
class="car-card market-item ${m[1]}">

<div class="car-image">

${carSVG(
m[0],
col.c,
col.h
)}

</div>


<div class="car-name">

${m[0]}

</div>


<div class="${m[1]}">

Автомобиль

</div>


<div class="muted">

Цена:
${money(m[2])} ₽

</div>


<button
class="buy"
onclick="buyCar(${i})">

Купить

</button>

</div>

`;

}

).join("");

}


/* =========================================
   ПОКУПКА
========================================= */

function buyCar(i){

let m=
market[i];


if(
data.balance<
m[2]
){

toast(
"❌ Недостаточно денег"
);

return;

}


let col=
colorFor();


data.balance-=
m[2];


data.spent+=
m[2];


data.garage.push({

name:m[0],

value:m[2],

type:
carDB[m[0]]?.caseType ||
"rare",

rarityClass:m[1],

color:col

});


update();


toast(
"🚗 Машина куплена"
);

}


/* =========================================
   НАВИГАЦИЯ
========================================= */

function showSection(
id,
btn
){

document
.querySelectorAll(".section")
.forEach(
x=>
x.classList.remove(
"active"
)
);


document
.getElementById(id)
.classList.add(
"active"
);


document
.querySelectorAll(".nav-btn")
.forEach(
x=>
x.classList.remove(
"active"
)
);


btn.classList.add(
"active"
);

}


/* =========================================
   ЗАПУСК
========================================= */

renderCases();

update();

</script>

</body>
</html>
